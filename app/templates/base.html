<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de reservas de equipos de laboratorio">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0D3B3E">
    <title>{% block title %}Equilab{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <header class="site-header" role="banner">
        <div class="container">
            <div class="header-content">
                <h1 class="site-title">
                    <a href="{{ url_for('web.index') }}" class="site-title__link" aria-label="Equilab, ir al inicio">
                        <span class="site-title__mark" aria-hidden="true">◆</span>
                        <span class="site-title__text">Equilab</span>
                    </a>
                </h1>
                <nav class="site-nav" aria-label="Navegación principal">
                    <ul class="nav-list">
                        <li>
                            <a href="{{ url_for('web.index') }}"
                            class="nav-link {% if request.endpoint == 'web.index' %}nav-link--active{% endif %}"
                            {% if request.endpoint == 'web.index' %}aria-current="page"{% endif %}>
                                Inicio
                            </a>
                        </li>
                        <li>
                            <a href="{{ url_for('web.availability') }}"
                            class="nav-link {% if request.endpoint == 'web.availability' %}nav-link--active{% endif %}"
                            {% if request.endpoint == 'web.availability' %}aria-current="page"{% endif %}>
                                Disponibilidad
                            </a>
                        </li>
                        <li>
                            <a href="{{ url_for('web.reservations') }}"
                            class="nav-link {% if request.endpoint == 'web.reservations' %}nav-link--active{% endif %}"
                            {% if request.endpoint == 'web.reservations' %}aria-current="page"{% endif %}>
                                Reservas
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="site-main" id="contenido" role="main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="container">
            <p class="footer-text">Sistema de reservas de laboratorio &mdash; Challenge</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
